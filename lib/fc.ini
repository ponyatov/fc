#!/usr/bin/env flang
// line comment

                    // bytecode entry area:
jmp  entry          // entry jump
addr heap           // first free byte after compiled code
addr 0              // latest item in vocabulary / or 0 if no vocabulary used

:test_controls
    jmp 0
    jnz 0x01
    call 0o750
    ret

:entry
    nop /* commands */ halt

:heap
    addr false      // `next=0` the last free block in list
    addr Msz-free   // `size` of primary free block (before process start)
    addr true       // `ref=0xFFFF` always allocated (parent=system)
:free
